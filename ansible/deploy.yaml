---
- name: Deploy application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Apply Kubernetes Deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ playbook_dir }}/../k8s/deployment.yaml"

    - name: Apply Kubernetes Service
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ playbook_dir }}/../k8s/service.yaml"
